function sayR(e,gb){const v=fm(e.v);if(e.k=='enter')return`find(${v}) call hua. Pehle children se results maangte hain.`;if(e.k=='null')return`${e.side} child nahi hai → if guard recursion skip karta hai. Ye real leaf nahi hai aur 0-value node bhi nahi.`;

  if(e.k=='ret'){P=e.kind=='two'?[[e.d,'g'],[e.c,'m']]:[[e.d,'g']];if(PAR[e.id])up=[e.id,PAR[e.id],'return '+fm(e.down)]}}
 draw(RT,{P,N,lab,up,dim:1});$('ti').textContent=e.k=='done'?'Result':'Step: '+phase;$('say').textContent=sayR(e,gb);$('eq').innerHTML='';
 const T=$('state');const row=(a,b)=>`<tr><td>${a}</td><td><b>${b}</b></td></tr>`,isR=e.k=='ret',two=isR&&e.kind=='two';

 const S=$('stack');S.innerHTML='<div class="hint">Call stack (top first):</div>';st.slice().reverse().forEach((id,j)=>{const d=document.createElement('div');d.className='st';d.textContent=`find(${fm(find(RT,id).v)}) — ${j==0&&e.k!='ret'?phase:'Waiting for child'}`;S.appendChild(d)});

function setTab(t){stop();tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
